name: Daily Edition

# Triggers the AI-news pipeline on the deployed backend.
#  - schedule:         one edition every morning + a catch-up slot
#  - workflow_dispatch: manual "Run workflow" button (with optional date)
#
# GitHub cron is best-effort: on-the-hour slots get skipped or delayed by
# hours under load (both happened on 2026-08-27/28). Hence two off-peak
# slots, and scheduled runs first check whether today's edition already
# exists so a late or duplicate firing never regenerates it.
#
# Required repository secrets:
#   API_BASE_URL    e.g. https://api.example.com   (no trailing slash)
#   TRIGGER_SECRET  same value as the backend's TRIGGER_SECRET env var
#
# Note: identical syntax runs on GitHub Actions and Forgejo/Gitea Actions.

on:
  schedule:
    - cron: "23 4 * * *" # 04:23 UTC daily (off-peak minute)
    - cron: "23 6 * * *" # 06:23 UTC fallback — skips if today's edition exists
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD, optional — defaults to today UTC)"
        required: false
        default: ""

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Secrets API_BASE_URL / TRIGGER_SECRET live in the "Production" environment.
    environment: Production
    timeout-minutes: 35
    steps:
      # Scheduled runs are skipped when today's edition is already published,
      # so the fallback slot and late cron firings never regenerate an edition.
      # Manual dispatch always runs (regenerating on purpose stays possible).
      - name: Check for existing edition
        id: check
        if: github.event_name == 'schedule'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          latest=$(curl -fsS "${API_BASE_URL%/}/api/editions/latest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("date",""))')
          echo "today=${today} latest=${latest}"
          if [ "${latest}" = "${today}" ]; then
            echo "Edition for ${today} already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger pipeline
        if: steps.check.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::Repository secret API_BASE_URL is not set (e.g. https://api.example.com)."
            exit 1
          fi
          if [ -z "${TRIGGER_SECRET:-}" ]; then
            echo "::error::Repository secret TRIGGER_SECRET is not set (must match the backend env)."
            exit 1
          fi
          base="${API_BASE_URL%/}"
          url="${base}/api/pipeline/trigger"
          if [ -n "${DATE_INPUT:-}" ]; then
            url="${url}?date=${DATE_INPUT}"
          fi
          echo "POST ${url}"
          # -f makes curl fail on 401 (bad secret) / 5xx.
          curl -fsS -X POST "${url}" -H "X-Trigger-Secret: ${TRIGGER_SECRET}"
          echo

      - name: Wait for completion
        if: steps.check.outputs.skip != 'true'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::Repository secret API_BASE_URL is not set."
            exit 1
          fi
          # 180 polls x 10s = 30 min: a free-tier daily-quota fallback run can
          # take ~29 min (each LLM call retries the dead model before falling back).
          status_url="${API_BASE_URL%/}/api/pipeline/status"
          for i in $(seq 1 180); do
            body=$(curl -fsS "${status_url}")
            state=$(printf '%s' "$body" | sed -n 's/.*"status" *: *"\([a-z]*\)".*/\1/p')
            echo "poll ${i}: ${state}"
            case "${state}" in
              done)  echo "${body}"; exit 0 ;;
              error) echo "Pipeline reported an error: ${body}"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the pipeline to finish."
          exit 1
