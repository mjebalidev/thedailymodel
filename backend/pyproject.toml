[project]
name = "ai-news-backend"
version = "0.1.0"
description = "AI News — daily AI newspaper backend (research agent -> analysis -> editorial -> API)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "ddgs>=9.14",
    "google-genai>=0.8",
    "apscheduler>=3.10",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the pre-0.16 default rule set; adopting the broader 0.16 defaults
# (BLE, UP, I, ...) is a separate cleanup, not a dependency-bump side effect.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
