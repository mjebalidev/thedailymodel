[project]
name = "ai-news-backend"
version = "0.1.0"
description = "AI News — daily AI newspaper backend (research agent -> analysis -> editorial -> API)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "ddgs>=8.0",
    "google-genai>=0.8",
    "apscheduler>=3.10",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
